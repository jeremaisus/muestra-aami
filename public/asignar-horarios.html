<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Asignar horarios — Muestra AAMI</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/nav.css" />
  <link rel="stylesheet" href="/css/alumnos.css" />
  <link rel="stylesheet" href="/css/asignar-horarios.css" />
</head>
<body>
  <div id="navPrincipal"></div>

  <p class="cerrado-aviso" id="cerradoAviso" hidden>
    La carga de horarios está cerrada por administración. Podés ver el estado, pero no asignar ni quitar.
  </p>

  <div class="asignar__filtros">
    <div class="asignar__campo" id="campoProfesor" hidden>
      <label for="selectProfesor">Profesor</label>
      <select id="selectProfesor">
        <option value="">Todos</option>
      </select>
    </div>
    <div class="asignar__campo asignar__campo--buscar">
      <label for="buscador">Buscar por nombre</label>
      <input type="search" id="buscador" placeholder="Nombre del alumno" autocomplete="off" />
    </div>
    <label class="alumnos__toggle">
      <input type="checkbox" id="mostrarAsignados" />
      Mostrar también asignados
    </label>
    <span class="alumnos__contador" id="contador"></span>
  </div>

  <p class="estado-carga" id="estadoCarga" hidden></p>

  <main id="lista" aria-live="polite"></main>

  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/asignar-horarios.js"></script>
</body>
</html>
