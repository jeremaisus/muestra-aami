<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Profesores — Muestra AAMI</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/nav.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <div id="navPrincipal"></div>

  <main class="admin">
    <h1 class="admin__titulo">Profesores</h1>

    <form class="admin-alta" id="formAlta">
      <div class="admin-alta__campo">
        <label for="nombreNuevo">Nombre</label>
        <input type="text" id="nombreNuevo" required />
      </div>
      <button type="submit">Agregar profesor</button>
      <p class="admin-alta__aviso" id="aviso" hidden></p>
    </form>

    <p class="estado-carga" id="estadoCarga" hidden></p>

    <div id="lista"></div>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/profesores.js"></script>
</body>
</html>
