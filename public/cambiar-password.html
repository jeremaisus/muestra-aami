<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Cambiar contraseña — Muestra AAMI</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <main class="auth">
    <h1>Cambiar contraseña</h1>
    <p class="auth__nota" id="intro">Es tu primer ingreso: elegí una contraseña nueva antes de seguir.</p>
    <form id="formCambiar">
      <p class="auth__error" id="error" hidden></p>
      <div class="auth__campo">
        <label for="passwordActual">Contraseña actual</label>
        <input type="password" id="passwordActual" autocomplete="current-password" required />
      </div>
      <div class="auth__campo">
        <label for="passwordNueva">Contraseña nueva</label>
        <input type="password" id="passwordNueva" autocomplete="new-password" minlength="8" required />
      </div>
      <div class="auth__campo">
        <label for="passwordConfirmar">Repetir contraseña nueva</label>
        <input type="password" id="passwordConfirmar" autocomplete="new-password" minlength="8" required />
      </div>
      <button type="submit" id="botonGuardar">Guardar y continuar</button>
    </form>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/cambiar-password.js"></script>
</body>
</html>
