<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Canciones — Muestra AAMI</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/nav.css" />
  <link rel="stylesheet" href="/css/grilla.css" />
  <link rel="stylesheet" href="/css/canciones.css" />
</head>
<body>
  <div id="navPrincipal"></div>

  <div class="panel">
    <header class="topbar">
      <div class="topbar__muestras" id="muestras" role="tablist" aria-label="Muestra"></div>
      <a class="topbar__drive" id="linkDrive" href="#" target="_blank" rel="noopener" hidden>Carpeta de Drive</a>
    </header>

    <form class="alta-cancion" id="formAlta" hidden>
      <div class="alta-cancion__fila">
        <div class="alta-cancion__campo alta-cancion__campo--titulo">
          <label for="titulo">Título</label>
          <input type="text" id="titulo" required />
        </div>
        <div class="alta-cancion__campo alta-cancion__campo--artista">
          <label for="artista">Artista</label>
          <input type="text" id="artista" />
        </div>
        <div class="alta-cancion__campo alta-cancion__campo--pais">
          <label for="pais">País</label>
          <input type="text" id="pais" placeholder="ej. Argentina" />
        </div>
        <div class="alta-cancion__campo alta-cancion__campo--tonalidad">
          <label for="tonalidad">Tonalidad</label>
          <input type="text" id="tonalidad" placeholder="ej. Sol mayor" />
        </div>
        <button type="submit" id="botonAlta">Agregar canción</button>
      </div>
      <p class="alta-cancion__aviso" id="avisoDuplicado" hidden></p>
    </form>

    <p class="estado-carga" id="estadoCarga" hidden></p>

    <main class="catalogo" id="catalogo" aria-live="polite"></main>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/muestra.js"></script>
  <script src="/js/canciones.js"></script>
</body>
</html>
