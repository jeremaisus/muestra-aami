<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Accesos — Muestra AAMI</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/nav.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <div id="navPrincipal"></div>

  <main class="admin">
    <h1 class="admin__titulo">Accesos</h1>

    <form class="admin-alta" id="formAlta">
      <div class="admin-alta__campo">
        <label for="nuevoUsuario">Usuario</label>
        <input type="text" id="nuevoUsuario" required />
      </div>
      <div class="admin-alta__campo">
        <label for="nuevoPassword">Contraseña inicial</label>
        <input type="text" id="nuevoPassword" minlength="8" required />
      </div>
      <div class="admin-alta__campo">
        <label for="nuevaEtiqueta">Etiqueta</label>
        <input type="text" id="nuevaEtiqueta" placeholder="Nombre para mostrar" required />
      </div>
      <div class="admin-alta__campo">
        <label for="nuevoRol">Rol</label>
        <select id="nuevoRol">
          <option value="profesor">Profesor</option>
          <option value="admin">Administración</option>
        </select>
      </div>
      <button type="submit">Crear acceso</button>
      <p class="admin-alta__aviso" id="aviso" hidden></p>
      <p class="admin-alta__nota">
        Si el rol es "Profesor", se crea junto con su fila en Profesores, ya vinculada.
      </p>
    </form>

    <p class="estado-carga" id="estadoCarga" hidden></p>

    <div id="lista"></div>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/accesos.js"></script>
</body>
</html>
