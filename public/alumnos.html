<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Alumnos — Muestra AAMI</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/nav.css" />
  <link rel="stylesheet" href="/css/grilla.css" />
  <link rel="stylesheet" href="/css/canciones.css" />
  <link rel="stylesheet" href="/css/alumnos.css" />
</head>
<body>
  <div id="navPrincipal"></div>

  <header class="topbar">
    <div class="topbar__muestras" id="muestras" role="tablist" aria-label="Muestra"></div>
  </header>

  <div class="alumnos__filtros">
    <label class="alumnos__toggle">
      <input type="checkbox" id="soloSinCancion" />
      Solo sin canción asignada
    </label>
    <span class="alumnos__contador" id="contador"></span>
  </div>

  <p class="estado-carga" id="estadoCarga" hidden></p>

  <main id="lista" aria-live="polite"></main>

  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/muestra.js"></script>
  <script src="/js/alumnos.js"></script>
</body>
</html>
